[dns]
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
EXTRACT-dns_fields = src_ip=(?P<src_ip>\S+) query="(?P<query>[^"]+)" qtype=(?P<qtype>\S+) response_code=(?P<response_code>\S+)

[access_combined]
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
EXTRACT-web_fields = (?P<clientip>\d+\.\d+\.\d+\.\d+) \S+ \S+ \[(?P<timestamp>[^\]]+)\] "(?P<method>\w+) (?P<uri>\S+) [^"]*" (?P<status>\d+) (?P<bytes>\d+)

[linux_secure]
TIME_FORMAT = %b %d %H:%M:%S

[syslog]
TIME_FORMAT = %b %d %H:%M:%S
