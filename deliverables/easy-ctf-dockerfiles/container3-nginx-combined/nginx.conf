server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Recruit Stage 1: Recon site ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # /staging/ — reachable via robots.txt breadcrumb, no auth intentionally
    location /staging/ {
        try_files $uri $uri/ =404;
    }

    # ── Recruit Stage 7: Phishing inbox ──────────────────────────────────────
    # /webmail/ serves the mock email client
    # Listed in robots.txt as Disallow — acts as a subtle breadcrumb for Stage 1
    # but the path name alone does not spoil Stage 7
    location /webmail/ {
        try_files $uri $uri/ =404;
    }

    # Disable directory listing everywhere
    autoindex off;

    # Standard security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
